name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * 0"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["go", "javascript-typescript", "java-kotlin"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK (Java)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      # Go: autobuild resolves the module. JS: the app lives in frontend/, so install
      # there; the source is still extracted from the whole checkout. Java: the sidecar
      # has no build file, so fetch its pinned jars and compile Sidecar.java directly.
      - name: Autobuild (Go)
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@v4
      - name: Install dependencies (JS)
        if: matrix.language == 'javascript-typescript'
        working-directory: frontend
        run: npm ci
      - name: Build (Java)
        if: matrix.language == 'java-kotlin'
        working-directory: sourceafis-sidecar
        run: |
          ./fetch-deps.sh
          javac -cp 'lib/*' -d classes Sidecar.java
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
