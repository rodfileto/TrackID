# Host ports default to the development stack's; a second stack (e.g. trackid-sim's stress
# test, its own compose project) sets them to others so both run side by side.
services:
  postgres:
    build: ./db/postgres
    image: trackid-postgres:pg16
    environment:
      POSTGRES_DB: trackid
      POSTGRES_USER: trackid
      POSTGRES_PASSWORD: trackid_dev
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - trackid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackid -d trackid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - trackid-redis:/data

  # Object storage: SeaweedFS's S3 gateway (docs/production-plan.md, decision 11). The bucket is
  # created by the API at its first start, unlocked: development data can be thrown away. The host
  # port is still 59000, as with MinIO before it, so S3_ENDPOINT stays the same.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      S3_ACCESS_KEY: trackid
      S3_SECRET_KEY: trackid_dev_storage
    ports:
      - "${S3_PORT:-${MINIO_PORT:-59000}}:8333"
    volumes:
      - ./seaweedfs/start.sh:/start.sh:ro
      - trackid-seaweedfs:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  # SourceAFIS fingerprint extraction/matching for the fingerprint package
  # (FINGERPRINT_SIDECAR_URL=http://localhost:58090). See sourceafis-sidecar/.
  sourceafis-sidecar:
    build: ./sourceafis-sidecar
    ports:
      - "${SIDECAR_PORT:-58090}:8090"

volumes:
  trackid-postgres:
  trackid-redis:
  trackid-seaweedfs:
