# Host ports default to the development stack's; a second stack (e.g. trackid-sim's stress
# test, its own compose project) sets them to others so both run side by side.
services:
  postgres:
    build: ./db/postgres
    image: trackid-postgres:pg16
    environment:
      POSTGRES_DB: trackid
      POSTGRES_USER: trackid
      POSTGRES_PASSWORD: trackid_dev
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - trackid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackid -d trackid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - trackid-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trackid
      MINIO_ROOT_PASSWORD: trackid_dev_storage
    ports:
      - "${MINIO_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - trackid-minio:/data

  # SourceAFIS fingerprint extraction/matching for the fingerprint package
  # (FINGERPRINT_SIDECAR_URL=http://localhost:58090). See sourceafis-sidecar/.
  sourceafis-sidecar:
    build: ./sourceafis-sidecar
    ports:
      - "${SIDECAR_PORT:-58090}:8090"

volumes:
  trackid-postgres:
  trackid-redis:
  trackid-minio:
