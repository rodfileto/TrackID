services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trackid
      POSTGRES_USER: trackid
      POSTGRES_PASSWORD: trackid_dev
    ports:
      - "55432:5432"
    volumes:
      - trackid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackid -d trackid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    volumes:
      - trackid-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trackid
      MINIO_ROOT_PASSWORD: trackid_dev_storage
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - trackid-minio:/data

  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    ports:
      - "57687:7687"
      - "57474:7474"
    environment:
      NEO4J_AUTH: neo4j/neo4j_dev
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_server_bolt_advertised__address: 127.0.0.1:57687
    volumes:
      - trackid-neo4j:/var/lib/neo4j/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackid-postgres:
  trackid-redis:
  trackid-minio:
  trackid-neo4j: