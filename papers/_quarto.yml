# General template shared by every paper in this directory.
#
# Individual papers override this by placing a `_metadata.yml` in their own
# subdirectory (see papers/paper1-tactical-linking/_metadata.yml for an
# example). Quarto merges directory-level `_metadata.yml` files with this
# project config when rendering a document, with the closer (paper-specific)
# file winning on any key it sets — including deep merges of nested keys like
# `format.pdf` or `bibliography`. Keys not overridden fall back to what's
# defined here.

project:
  type: default

bibliography: references.bib
number-sections: true

crossref:
  fig-title: Figure
  tbl-title: Table

author:
  - name: Rodrigo Fileto
    affiliations:
      - name: TrackID Research

format:
  html:
    toc: true
    theme: cosmo
    embed-resources: true
  pdf:
    documentclass: article
    geometry:
      - margin=1in
    fontsize: 11pt
    colorlinks: true
    keep-tex: false
  docx:
    toc: false

execute:
  echo: false
  warning: false
  freeze: auto
