version: "3.8"

services:
  # PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trackid-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trackid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for task queue
  redis:
    image: redis:7-alpine
    container_name: trackid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Memgraph - knowledge graph store for the Target/Situation/Event/Target
  # Entity ontology (see docs/DTID_ARCHITECTURE.md). Bolt protocol on 7687,
  # same port the neo4j Python driver defaults to.
  memgraph:
    image: memgraph/memgraph:latest
    container_name: trackid-memgraph
    ports:
      - "7687:7687"
    volumes:
      - memgraph_data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole --host 127.0.0.1 --port 7687 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO - S3-compatible object storage for persisted videos + face crops
  minio:
    image: minio/minio:latest
    container_name: trackid-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Host ports shifted off the 9000/9001 default - already bound by
      # another project's MinIO container on this machine. Internal
      # container-to-container traffic (backend -> minio:9000) is unaffected.
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GPU: "1"
    container_name: trackid-backend
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/trackid
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9010
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: trackid-media
      FACE_USE_GPU: "True"
      FACE_QUALITY_USE_GPU: "True"
      MEMGRAPH_URI: bolt://memgraph:7687
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python main.py"
    # Requires the NVIDIA Container Toolkit on the host (nvidia runtime
    # registered with Docker) - see backend/README.md "GPU acceleration".
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  memgraph_data:
