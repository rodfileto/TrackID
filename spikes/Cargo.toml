[package]
name = "trackid-spikes"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
neo4rs = "0.9.0-rc.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }
pgvector = { version = "0.4.2", features = ["sqlx"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
axum = { version = "0.8.9", features = ["multipart"] }
reqwest = { version = "0.13.4", default-features = false, features = ["multipart", "json"] }
